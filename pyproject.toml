[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "android-dojo-toolkit"
version = "0.1.0"
description = "Safety-first Android diagnostic, recovery, firmware, partition, and image workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "James Earl Stambaugh III" }
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.scripts]
android-dojo = "android_dojo_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
